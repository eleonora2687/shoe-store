{% extends 'base.html' %}

{% block title %}
{{ product.name }}
{% endblock %}

{% block content %}

<div class="row">

    <div class="col-md-6">

        {% if product.image %}

        <img
            src="{{ product.image.url }}"
            class="img-fluid rounded shadow"
            alt="{{ product.name }}"
        >

        {% endif %}

    </div>

    <div class="col-md-6">

        <h1>{{ product.name }}</h1>

        <h4 class="text-muted">
            {{ product.brand }}
        </h4>

        <h3 class="text-success mt-3">
            ${{ product.price }}
        </h3>

        <p class="mt-4">
            {{ product.description }}
        </p>

        <p>
            <strong>Stock:</strong> {{ product.stock }}
        </p>

        <a
            href="{% url 'add_to_cart' product.id %}"
            class="btn btn-primary mt-3"
        >
            Add to Cart 🛒
        </a>

        <a
            href="/"
            class="btn btn-secondary mt-3"
        >
            ← Back
        </a>

    </div>

</div>

{% endblock %}
