<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ product.name }}</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Shoe Store</a>
    </div>
</nav>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-6">
            <img 
                src="{{ product.image.url }}" 
                class="img-fluid rounded shadow"
                alt="{{ product.name }}"
            >
        </div>

        <div class="col-md-6">

            <h1>{{ product.name }}</h1>

            <h4 class="text-muted">
                {{ product.brand }}
            </h4>

            <h3 class="text-success mt-3">
                ${{ product.price }}
            </h3>

            <p class="mt-4">
                {{ product.description }}
            </p>

            <p>
                <strong>Stock:</strong> {{ product.stock }}
            </p>

            <a href="/" class="btn btn-secondary mt-3">
                ← Back
            </a>


            <a href="{% url 'add_to_cart' product.id %}" class="btn btn-primary mt-3">
    Add to Cart 🛒
</a>
        </div>

    </div>

</div>

</body>
</html>
