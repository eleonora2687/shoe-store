<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Noraki' s Shoe Store{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            Shoe Store
        </a>

        <a href="{% url 'cart_view' %}" class="btn btn-outline-light">
            🛒 Bag
        </a>





        {% if user.is_authenticated %}

        <span class="text-white mt-2">
            Hello, {{ user.username }}
        </span>

        <a href="{% url 'logout' %}" class="btn btn-danger">
            Logout
        </a>

    {% else %}

        <a href="{% url 'login' %}" class="btn btn-outline-light">
            Login
        </a>

        <a href="{% url 'register' %}" class="btn btn-warning">
            Register
        </a>

    {% endif %}

    </div>

</nav>

<div class="container mt-5">

    {% block content %}

    {% endblock %}

</div>

</body>

</html>
