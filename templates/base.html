<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Noraki's Shoe Store{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<nav class="navbar navbar-dark bg-dark shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
             Noraki's Shoe Store
        </a>

        <div class="ms-auto d-flex align-items-center">

            <a href="{% url 'wishlist' %}" class="btn btn-outline-light me-2">
    ❤️ Wishlist
</a>
            <a href="{% url 'cart_view' %}" class="btn btn-outline-light me-2">
                🛒 Bag
            </a>

            {% if user.is_authenticated %}
                <span class="text-white me-3">
                    Hello, {{ user.username }}
                </span>
                <a href="{% url 'my_orders' %}" class="btn btn-outline-light me-2">
                    My Orders
                </a>

                

                <a href="{% url 'logout' %}" class="btn btn-danger">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}" class="btn btn-outline-light me-2">
                    Login
                </a>

                <a href="{% url 'register' %}" class="btn btn-warning">
                    Register
                </a>

            {% endif %}

        </div>

    </div>

</nav>

<div class="container mt-5">

    {% block content %}

    {% endblock %}

</div>

</body>

</html>
